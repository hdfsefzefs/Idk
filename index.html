<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; }
  #wrap { position: relative; width: 200px; height: 210px; }
  canvas { position: absolute; cursor: grab; }
  #c { left: 40px; top: 114px; image-rendering: pixelated; }
  #t { left: 20px; top: 60px; display: none; }
  #bubble {
    position: absolute; left: 20px; top: 8px; width: 160px; text-align: center;
    font: 13px/1.3 system-ui, sans-serif; color: #222; background: #fff;
    border: 2px solid #222; border-radius: 8px; padding: 4px 6px;
    opacity: 0; transition: opacity .15s; pointer-events: none;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="bubble"></div>
  <canvas id="c" width="120" height="96"></canvas>
  <canvas id="t" width="160" height="150"></canvas>
</div>
<script src="renderer.js"></script>
</body>
</html>
